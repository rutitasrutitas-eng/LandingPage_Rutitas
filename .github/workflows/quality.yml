name: Quality and security checks

on:
  pull_request:
    # Temporal: el PR apilado LANDING-002 apunta a esta rama.
    branches: [main, feature/landing-001-compliance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify landing page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets (pinned Gitleaks image)
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact --exit-code 1 /repo

      - name: Set up Node.js 24 (actions/setup-node v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify SDD traceability
        run: npm run sdd:verify

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare test evidence directory
        run: mkdir -p test-results

      - name: Unit and integration tests
        run: npm run test -- --reporter=junit --outputFile=test-results/unit.xml

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit

      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: landing-quality-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
